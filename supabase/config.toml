
[functions.process-booking-emails]
enabled = true
verify_jwt = false
import_map = "./functions/process-booking-emails/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/process-booking-emails/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/process-booking-emails/*.html" ]

[functions.square-payment]
enabled = true
verify_jwt = true
import_map = "./functions/square-payment/deno.json"
entrypoint = "./functions/square-payment/index.ts"

# Square authenticates this endpoint with its signature, not a Supabase JWT.
[functions.square-webhook]
enabled = true
verify_jwt = false
import_map = "./functions/square-webhook/deno.json"
entrypoint = "./functions/square-webhook/index.ts"
